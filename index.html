<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macros Food - Comida Real. Resultados Reales.</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2ecc71;
            --accent-green-hover: #27ae60;
            --text-light: #ffffff;
            --text-gray: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            background: #000;
            border-bottom: 2px solid var(--accent-green);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span {
            color: var(--accent-green);
            font-weight: 300;
            display: block;
            font-size: 1.2rem;
            letter-spacing: 4px;
            margin-top: -5px;
        }

        .tagline {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 1.5rem;
            border-left: 4px solid var(--accent-green);
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-green);
            transform: translateY(-3px);
        }

        .card-img-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #111;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--accent-green);
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .card-content {
            padding: 18px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-desc {
            color: var(--text-gray);
            font-size: 0.88rem;
            margin-bottom: 15px;
            line-height: 1.4;
            min-height: 42px;
        }

        .macros {
            display: flex;
            justify-content: space-between;
            background: #161616;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
        }

        .macro-item {
            text-align: center;
        }

        .macro-val {
            font-weight: bold;
            color: var(--accent-green);
            display: block;
            font-size: 0.95rem;
        }

        .card-footer {
            padding: 12px 18px;
            background: #181818;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .btn-add {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--accent-green-hover);
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 1px solid var(--accent-green);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .cart-btn {
            background: var(--accent-green);
            color: #000;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .cart-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MACROS<span>FOOD</span></div>
        <div class="tagline">Comida Real. Resultados Reales.</div>
    </header>

    <div class="container">
        <div class="section-title">Nuestros Platos</div>
        <div class="grid" id="menu-container"></div>
    </div>

    <div class="cart-bar">
        <div>
            <div style="font-size: 0.8rem; color: var(--text-gray);">Total estimado:</div>
            <div style="font-size: 1.3rem; font-weight: bold;" id="cart-total">$0</div>
        </div>
        <button class="cart-btn" id="send-btn" disabled onclick="enviarPedido()">
            Pedir por WhatsApp (<span id="cart-count">0</span>)
        </button>
    </div>

    <script>
        const productos = [
            {
                id: 1,
                tag: "01 THE POWER",
                name: "The Power",
                desc: "Pollo a la plancha con papas rústicas y ensalada fresca.",
                kcal: "550",
                prot: "60G",
                carb: "50G",
                precio: 6500,
                img: "watermarked_img_2613181562270569147.jpg"
            },
            {
                id: 2,
                tag: "02 THE BALANCE",
                name: "The Balance",
                desc: "Carne magra con papas rústicas y vegetales al vapor.",
                kcal: "420",
                prot: "45G",
                carb: "35G",
                precio: 7000,
                img: "watermarked_img_16740063895439544593.jpg"
            },
            {
                id: 3,
                tag: "03 THE FUEL",
                name: "The Fuel",
                desc: "Pavo al horno con arroz integral y ensalada mixta.",
                kcal: "480",
                prot: "50G",
                carb: "45G",
                precio: 6800,
                img: "watermarked_img_14651068744978297752.jpg"
            }
        ];

        let carrito = {};

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = productos.map(prod => `
                <div class="card">
                    <div class="card-img-container">
                        <span class="badge">${prod.tag}</span>
                        <img src="${prod.img}" alt="${prod.name}" class="card-img" />
                    </div>
                    <div class="card-content">
                        <div class="card-title">${prod.name}</div>
                        <div class="card-desc">${prod.desc}</div>
                        <div class="macros">
                            <div class="macro-item"><span class="macro-val">${prod.kcal}</span>KCAL</div>
                            <div class="macro-item"><span class="macro-val">${prod.prot}</span>PROTEÍNA</div>
                            <div class="macro-item"><span class="macro-val">${prod.carb}</span>CARBOS</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="price">$${prod.precio.toLocaleString()}</div>
                        <button class="btn-add" onclick="agregarAlCarrito(${prod.id})">+ Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function agregarAlCarrito(id) {
            carrito[id] = (carrito[id] || 0) + 1;
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            let totalItems = 0;
            let totalPrecio = 0;

            for (let id in carrito) {
                const prod = productos.find(p => p.id == id);
                totalItems += carrito[id];
                totalPrecio += prod.precio * carrito[id];
            }

            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-total').innerText = '$' + totalPrecio.toLocaleString();
            
            const btn = document.getElementById('send-btn');
            btn.disabled = totalItems === 0;
        }

        function enviarPedido() {
            const telefono = "56989704317";
            let mensaje = "¡Hola Macros Food! 👋 Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;

            for (let id in carrito) {
                const prod = productos.find(p => p.id == id);
                const subtotal = prod.precio * carrito[id];
                mensaje += `• *${carrito[id]}x ${prod.name}* ($${subtotal.toLocaleString()})\n`;
                total += subtotal;
            }

            mensaje += `\n*Total a pagar: $${total.toLocaleString()}*`;
            mensaje += `\n\nQuedo atento para confirmar la dirección de envío y método de pago.`;

            const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        renderMenu();
    </script>
</body>
</html>
